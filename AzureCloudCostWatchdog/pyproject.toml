[project]
name = "azure-cloud-cost-watchdog"
version = "0.1.0"
description = "A serverless Azure solution designed to monitor resources and automatically shut down non-production or untagged Virtual Machines to prevent cloud bill shock."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Azure Cloud Cost Watchdog Team"}
]
keywords = ["azure", "monitoring", "cost", "watchdog", "vm", "shutdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: DevOps Engineers",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "azure-identity>=1.15.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-resource>=22.0.0",
    "requests>=2.31.0",
    "pymsteams>=0.1.3",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "python-dateutil>=2.0.0",
]

[project.urls]
homepage = "https://github.com/AzureCloudCostWatchdog/azure-cloud-cost-watchdog"
repository = "https://github.com/AzureCloudCostWatchdog/azure-cloud-cost-watchdog.git"
"Bug Tracker" = "https://github.com/AzureCloudCostWatchdog/azure-cloud-cost-watchdog/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
